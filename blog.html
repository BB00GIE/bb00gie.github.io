<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Project updates by Brandon Elmore.">
  <title>Project updates — Brandon Elmore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="blog.js" defer></script>
</head>
<body class="blog-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="index.html#top" aria-label="Brandon Elmore home">BE<span>.</span></a>
    <a class="text-link" href="index.html#work">Back to work <span>←</span></a>
  </header>

  <main id="main-content">
    <section class="blog-hero section-wrap">
      <p class="eyebrow">Project journal</p>
      <h1 id="project-title">Loading project...</h1>
      <p id="project-description" class="blog-description">Fetching the latest project details.</p>
      <a id="github-link" class="text-link" href="#" target="_blank" rel="noreferrer" hidden>View repository <span>↗</span></a>
    </section>

    <section class="blog-content section-wrap">
      <div class="section-heading"><p class="eyebrow">Updates</p><p id="update-count" class="section-note">0 entries</p></div>
      <div class="auth-panel" id="auth-panel">
        <p id="auth-status">Sign in to publish project updates.</p>
        <button id="sign-in" type="button">Sign in with GitHub <span aria-hidden="true">↗</span></button>
        <button id="sign-out" type="button" hidden>Sign out <span aria-hidden="true">↗</span></button>
      </div>
      <p id="access-message" class="access-message" hidden></p>
      <form id="update-form" class="update-form" hidden>
        <p id="update-form-heading" class="eyebrow">New update</p>
        <label for="update-title">Update title</label>
        <input id="update-title" name="title" type="text" maxlength="120" placeholder="What changed?" required>
        <label for="update-body">Update</label>
        <textarea id="update-body" name="body" rows="7" placeholder="Write a note about this project..."></textarea>
        <label for="update-image">Image</label>
        <input id="update-image" name="image" type="file" accept="image/*">
        <p class="form-hint">Add a note, an image, or both. Images must be 5 MB or smaller.</p>
        <div class="update-form-actions">
          <button type="submit">Publish update <span aria-hidden="true">+</span></button>
          <button id="update-cancel" class="button-secondary" type="button" hidden>Cancel</button>
        </div>
      </form>
      <div id="updates" class="updates" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
